# Whole app: backend services (backend/docker-compose.yml) + the website.
#
#   docker compose up -d --build      → open http://127.0.0.1:3000
#
# The backend can still be run on its own from backend/ (same project name and volumes).
name: personal-ai-companion

include:
  - backend/docker-compose.yml

services:
  web:
    build: ./frontend
    image: personal-ai-web:latest
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
