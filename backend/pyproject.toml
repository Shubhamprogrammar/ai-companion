[project]
name = "personal-ai-companion"
version = "0.1.0"
description = "Backend for a Personal AI Voice Companion"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires running PostgreSQL and Redis (docker compose up -d db redis)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["S105", "S106", "ASYNC240"]  # fake credentials; small sync fs checks in tests
"scripts/*" = ["ASYNC240"]  # one-off CLI scripts
